effect:
  text: ●当【决令】移出游戏后，将【诏书】置入牌堆底。●当你使用【诏书】后，将此牌放置在你的武将牌上，势力与你相同的角色出牌阶段限一次，该角色可以将一张手牌（小势力角色改为至多两张手牌）置于【诏书】上；出牌阶段限一次，若【诏书】上有四张花色均不同的牌，你可以将【诏书】上所有的牌放入弃牌堆，然后随机获得一张势力锦囊。"破除浊流，书论伊尹，再四稽之，勿负朕意！"——刘协
  skills: []
review_note: 卡面左下角印的类型标签是「裝備/寶物」，所以是装备·宝物；（此前误按普通锦囊登记）
