text: |-
  锁定技，每当你受到1点伤害后，你令来源获得1枚“梦魇”标记；锁定技，当你死亡时，你令一名拥有最多“梦魇”标记的其他角色判定，若结果不为【桃】或【桃园结义】，其死亡。
