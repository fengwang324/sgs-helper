text: "出牌阶段开始时，你可以移去一张“戳”，选择获得下列效果中的一项：\r\n1.此回合内你对此“戳”对应势力角色造成伤害时，你令此伤害+1；\r\n2.此回合内你对此“戳”对应势力角色造成伤害时，你获得其一张牌；\r\n3.此回合内你对此“戳”对应势力角色使用牌无次数限制。\r\n出牌阶段结束时，你可以移去两张“戳”，然后直到你下回合开始时，当其他角色对你造成伤害时，你令此伤害一1。"
