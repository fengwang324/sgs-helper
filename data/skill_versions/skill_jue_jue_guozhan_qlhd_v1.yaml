text: |-
  你杀死势力与你相同的角色不执行奖惩。弃牌阶段开始时，你可以失去1点体力，然后此阶段结束时，若你于此阶段内弃置过手牌，则你令所有其他角色各选择一项：1.令你对其造成1点伤害：2.将×张手牌放入弃牌堆（X为你于此阶段内弃置的牌数)。
