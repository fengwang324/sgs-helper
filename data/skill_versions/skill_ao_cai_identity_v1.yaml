id: skill_ao_cai_identity_v1
skill_id: skill_ao_cai
mode: identity
text: |-
  每当你于回合外需要使用或打出【杀】/【闪】时，你可以观看牌堆顶的两张牌，若如此做，你可以使用或打出其中的一张【杀】/【闪】；每当你于回合外需要对你使用【桃】或【酒】时，你可以观看牌堆顶的两张牌，若如此做，你可以对自己使用其中的一张【桃】或【酒】；每当你于回合外需要使用【桃】时，你可以观看牌堆顶的两张牌，若如此做，你可以以方法Ⅱ使用其中的一张【桃】。
