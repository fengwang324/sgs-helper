text: |-
  出牌阶段限一次，你可以与一名角色拼点：当你赢后，你于此回合内使用【杀】的额外次数上限+1且使用【杀】无距离限制且使用【杀】的额外目标数上限+1；当你没赢后，你于此回合内不能使用【杀】。
