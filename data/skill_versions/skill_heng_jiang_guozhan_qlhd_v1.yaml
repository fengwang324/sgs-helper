text: |-
  当你受到1点伤害后，若当前回合角色手牌上限大于0，则你可以令其于此回合内手牌上限-X。然后此回合结束时，若其未于此回合的弃牌阶段内弃置过其牌，则你将手牌摸至体力上限(X为其装备区内的牌数且至少为1）。
