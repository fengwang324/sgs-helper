text: |-
  觉醒技，准备阶段开始时，若“权”数不小于3，你减1点体力上限，然后选择一项：1.回复1点体力；2.摸两张牌。最后你获得“排异”（出牌阶段限一次，你可以将一张“权”置入弃牌堆并选择一名角色，令其摸两张牌，然后若其手牌多于你，你对其造成1点伤害）。
