text: |-
  每当你于出牌阶段内使用【杀】或黑色非延时类锦囊牌指定目标时，若目标数为1，你可以令除该目标外的是你使用此牌的合法目标的一名其他角色选择一项：1.将一张牌交给你，若如此做，其代替你成为此牌的使用者；2.也成为此牌的目标。每阶段限一次。
