text: |-
  锁定技，你根据场上有受伤角色的势力数获得以下效果：1个或以上，你拥有“恂恂”；2个或以上，当你受到伤害后，你与伤害来源两者中手牌数较少的角色摸一张牌；3个或以上，于此回合内你的手牌上限+4；4个或以上，当你失去装备区里的牌时，你摸一张牌。
