text: |-
  觉醒技，准备阶段开始时，若你拥有的“忍”标记数不小于4，你减1点体力上限，然后获得“极略”（每当一名角色的判定牌生效前，若你有手牌，你可以弃1枚“忍”标记并发动“鬼才”；每当你受到伤害后，你可以弃1枚“忍”标记并发动“放逐”；每当你使用锦囊牌时，你可以弃1枚“忍”标记并发动“集智”；出牌阶段限一次，若你有牌，你可以弃1枚“忍”标记并发动“制衡”；出牌阶段，你可以弃1枚“忍”标记，令你于此回合内拥有“完杀”的效果。）
