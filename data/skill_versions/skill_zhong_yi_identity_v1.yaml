text: |-
  限定技，出牌阶段，你可以将一张红色手牌置于武将牌上，称为“义”，若如此做，当身份牌下次恢复原状时，你将此“义”置入弃牌堆；每当己方角色使用【杀】对目标角色造成伤害时，若有“义”，你令伤害值+1。
