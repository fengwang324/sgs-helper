text: |-
  每名于其回合内弃置任意角色牌的总数大于你体力值的角色的结束阶段，若你是该角色，则你可以选择一名势力与你相同的角色并令其将手牌摸至X张（X为其体力上限）否则该角色可以选择一项：1.弃置你一张牌；2.令你回复1点体力。
