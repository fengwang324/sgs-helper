id: skill_bu_qu_identity_v1
skill_id: skill_bu_qu
mode: identity
text: |-
  锁定技，每当你处于濒死状态时，你将牌堆顶的一张牌置于武将牌上，称为“创”，若此“创”与其他的“创”点数均不同，你将体力值回复至1点，否则你将此“创”置入弃牌堆；锁定技，若有“创”，你的手牌上限为X（X为“创”数）。
