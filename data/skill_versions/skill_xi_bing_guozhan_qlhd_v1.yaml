text: 当一名其他角色于其出牌阶段使用第一张黑色【杀】或黑色普通锦囊牌指定唯一目标后，若其手牌数小于其体力值，你可令该角色将手牌摸至其当前体力值（至多摸至五张），若如此做其本回合不能再使用手牌。若你与其均明置所有武将牌，则你可以暗置你与其各一张武将牌且本回合不能再明置这些武将牌。
