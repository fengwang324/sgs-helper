text: |-
  每当你使用或其他角色于你的回合内使用【闪】时，你可以将牌堆顶的一张牌置于武将牌上，称为“钤”；其他角色的出牌阶段开始时，你可以将一张“钤”置入弃牌堆，令其于此阶段内使用【杀】的额定次数上限-1。
