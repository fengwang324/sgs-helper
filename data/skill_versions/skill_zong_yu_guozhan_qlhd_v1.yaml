text: |-
  当【六龙骖驾】进入其他角色的装备区后，若你装备区里有坐骑牌，则你可以与其交换装备区里所有的坐骑牌。当你使用一张坐骑牌时，若弃牌堆中或场上存在【六龙骖驾】，则你可以将此次使用的坐骑牌放入弃牌堆，然后将该【六龙骏驾】放入你的装备区。
