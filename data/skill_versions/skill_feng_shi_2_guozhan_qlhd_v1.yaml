text: 当你使用牌指定唯一目标后，若你与目标角色均有牌且其手牌数小于你，则你可以弃置你与其各一张牌，然后令此牌伤害+1。当你成为其他角色使用牌的唯一目标后，若你与其均有牌且你的手牌数小于其，则其可以令你弃置你与其各一张牌，然后令此牌伤害+1。
