text: 锁定技，若你于回合内下列效果的发动总次数小于3，则你于此回合内拥有下列效果：1.你为伤害来源的【杀】或【决斗】对其他角色造成的伤害+1:2.使用非转化的锦囊牌无距离限制且使用时摸一张牌3.当其他角色的牌因弃置而进入弃牌堆时，你获得其一张牌；回合结束时，若你于此回合内发动上述效果的次数小于3，则你获得“反馈”直到你下回合开始时。
