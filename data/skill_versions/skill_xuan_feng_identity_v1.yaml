text: |-
  每当你失去装备区里的牌后，你可以依次弃置一名有牌的其他角色的两张牌，或选择两名有牌的其他角色，弃置这些角色的各一张牌；弃牌阶段结束时，若你于此阶段内弃置过你的至少两张手牌，你可以依次弃置一名有牌的其他角色的两张牌，或选择两名有牌的其他角色，弃置这些角色的各一张牌。
