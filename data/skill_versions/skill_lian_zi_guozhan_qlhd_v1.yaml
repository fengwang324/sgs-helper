text: 出牌阶段限一次，你可以弃置一张手牌，然后亮出牌堆顶的X张牌，你获得其中所有与你以此法弃置牌类别相同的牌，将其余的牌放入弃牌堆；若你以此法得到的牌数大于3，则你失去“敛资”，获得“制衡”（X为所有吴势力角色装备区里的牌数与“烽火”数之和）。
