text: 限定技，出牌阶段，你可以发起一个“军令”势力与你相同的其他角色（未确定势力的角色若明置武将牌所确定的势力与你相同，则其此时可以明置武将牌）均可以执行此军令。你和每名执行此军令的角色各加1点体力上限，回复1点体力，然后你摸X张牌（X为以此法回复体力的角色数）。
