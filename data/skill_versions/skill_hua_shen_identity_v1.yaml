text: |-
  所有玩家亮出武将牌后，你随机将两张游戏外的武将牌扣置于一旁，形成“化身牌堆”（扣置入过“化身牌堆”的牌称为“化身牌”，武将牌须扣置入“化身牌堆”，“化身牌堆”里的牌对你可见），然后选择一张“化身牌”；回合开始时和结束后，你可以选择一张“化身牌”。
