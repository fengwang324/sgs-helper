text: 当你明置此武将牌时，你可以选择一名其他角色。该角色造成伤害后，你摸一张牌：该角色受到伤害后，你弃置一张手牌：弃牌阶段结束时，该角色获得你此阶段弃置的牌：其死亡时，若你所有武将牌均明置，你暗置此武将牌；若其未死亡，此武将牌不能被暗置。
