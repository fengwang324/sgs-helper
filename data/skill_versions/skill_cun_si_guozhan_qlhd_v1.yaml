text: 出牌阶段，你可以移除此武将牌，若如此做，你令一名角色获得“勇决”（当一名势力与你相同的角色于其出牌阶段内使用的【杀】结算结束后，若此【杀】是其于此阶段内使用的第一张牌，则其可以获得之），然后若获得“勇决”的角色不是你，则其摸两张牌。
