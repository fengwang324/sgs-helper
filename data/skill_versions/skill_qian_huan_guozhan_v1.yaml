id: skill_qian_huan_guozhan_v1
skill_id: skill_qian_huan
mode: guozhan
text: |-
  每当与你势力相同的一名角色受到伤害后，若其存活，你可以将牌堆顶的一张牌置于武将牌上，称为“幻”，若此“幻”与另一张“幻”花色相同，你将此“幻”置入弃牌堆；每当与你势力相同的一名角色成为基本牌或锦囊牌的目标时，若目标数为1，你可以将一张“幻”置入弃牌堆，取消该角色。
