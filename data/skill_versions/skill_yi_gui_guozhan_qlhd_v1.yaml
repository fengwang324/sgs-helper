text: 当你首次明置此武将牌后，你将两张未加入游戏的武将牌扣置于你的武将牌上，称为“魂”牌。当你需要使用你于此回合内未以此法使用过的任意基本牌或普通锦囊牌时，你可以移去一张“魂”牌，然后视为使用之，且此牌的目标必须为与此“魂”牌势力相同或未确定势力的角色。
