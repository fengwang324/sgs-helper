text: |-
  每当你对一名其他角色造成伤害时，若其体力值不小于你，你可以弃置一张黑色手牌，令伤害值+1；每当你受到一名其他角色造成的伤害时，若其体力值不小于你，你可以弃置一张红色手牌，令伤害值-1。
