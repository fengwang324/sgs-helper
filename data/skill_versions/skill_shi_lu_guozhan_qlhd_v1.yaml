text: 当一名角色死亡后，你可以将其武将牌置于你的武将牌旁，称为“戳”，若杀死其的角色是你，则你从未加入游戏的武将牌中随机获得两张“戳”。准备阶段，你可以弃置至多与“戳”等量的牌，然后摸X张牌（X为你此次弃置的牌数）。
