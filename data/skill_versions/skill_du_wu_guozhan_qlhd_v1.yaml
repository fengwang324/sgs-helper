text: |-
  限定技，出牌阶段，你可以对你攻击范围内所有其他势力的角色发起一个“军令”若其中每有一名角色不执行，则你对该角色造成1点伤害，然后你摸一张牌；当所有军令”结算结束后，若“军令”结算期间有角色进入濒死状态被救回，则你失去1点体力。
