text: |-
  每名其他角色的准备阶段，你可以弃置你装备区里的一张牌，视为对其使用一张无距离限制的【杀】，若其体力值小于你，则此【杀】不能被响应，然后你可以重复此流程。此回合结束时，若你因此而杀死过其他角色，则你可以变更一次副将且变更后的副将武将牌处于暗置状态。
