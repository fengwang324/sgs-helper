text: |-
  你可以将一张手牌当一张基本牌或非延时类锦囊牌背面朝上使用或打出，其他角色可以质疑。若没有角色质疑，你亮出之，取消不合法的目标。当有角色质疑，你亮出之：若为假，终止此牌的结算流程，你将之置入弃牌堆；若为真，其获得“缠怨”（锁定技，你不能对“蛊惑”进行质疑；锁定技，若你的体力值为1，你除“缠怨”外的技能无效），然后取消不合法的目标。每名角色的回合内限一次。
