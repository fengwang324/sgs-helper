id: faq_073
question: 普通敌方被你杀死，摸牌奖励按剩余人数还是还算死者？
answer: |-
  奖励人数包括刚被杀死的角色，不是只数结算后仍活着的队友。已确定势力的非野心家击杀不同势力角色时，按被杀者所属势力的人数计算摸牌，死者本人计入。
  例如，敌方势力原有三名存活角色，你杀死其中一名，通常摸三张，而不是两张。
  还须区分其他明确情况：野心家击杀其他角色固定摸三张；击杀同势力角色须弃置所有手牌和装备牌；击杀者仍全暗、未确定势力则不执行击杀奖惩。被杀者全暗时先展示其武将、确定其势力，再判断奖惩。
variant: 群狼环鼎
