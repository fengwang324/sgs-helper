id: faq_049
question: |-
  九州鼎达成额外胜利，还要先暴露野心吗？
answer: |-
  按所引玩家 FAQ，要先处理暴露野心，再判断是否仍能获胜。不能因为九州鼎提供额外胜利条件，就略过仅明置副将的野心家主将。
  九州鼎要求装备区里有至少四张奇珍牌，鼎自身也计入这四张；符合时由装备者的当前阵营获胜。若此时仍有须暴露野心的角色，先明置其野心家主将；仍有标记且存活人数至少三名时，可以拉拢一名符合资格的角色。
  势力及阵营处理完毕后，重新检查九州鼎条件和获胜阵营。四张奇珍仍在装备区，不等于必须按暴露前的阵营立即宣布胜利。手册给出暴露野心机制，扩展到九州鼎的先后顺序来自玩家解释。
variant: 群狼环鼎
