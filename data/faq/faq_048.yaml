id: faq_048
question: 野心家武将变更副将，需要找到另一个野将吗？
answer: |-
  不应寻找另一张野心家武将作副将。手册明确野心家武将只能作主将，因此野心家副将不合法。
  对牌面为野心家的主将，所引玩家 FAQ 的变更办法是逐张翻牌，取第一张非野心家武将作新副将；不是等到一张野心家，也不是任意挑一个势力。
  该筛选办法是补充的玩家解释。普通武将因人数过半或君主死亡获得野心家身份，与牌面本来是野心家的主将不是同一种情况，不能仅凭角色当前叫“野心家”就把该筛选办法推广给前者。
variant: 群狼环鼎
