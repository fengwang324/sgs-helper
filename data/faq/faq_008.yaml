id: faq_008
question: 全暗角色可以被当作与你势力不同的人吗？
answer: |-
  不能一概算作不同势力。须区分效果的具体用语：
  1. “势力不同的角色”：双方须已确定势力。两张武将均暗置的角色不满足这一条件；已确定势力的野心家与其他角色视为势力不同。
  2. “其他势力的角色”：手册允许把未确定势力的角色包括在内。
  3. “势力相同的角色”：也要求能够确定双方势力，不能凭暗置武将实际印着同一势力就认定同势力。
  因此，要按牌或技能使用的是哪一种表述选目标，不能把“势力不同”和“其他势力”混用。
variant: 群狼环鼎
