id: faq_023
question: 场上只有三人，阵法技必定无效吗？
answer: |-
  不能仅因只剩三人就认定阵法技全部无效。群狼环鼎手册没有旧版“至少四名存活角色”的统一门槛，应检查具体阵法技所需的座位关系。
  队列要求至少两名同势力角色连续相邻；围攻要求被围攻者的上家、下家互为同势力，且均与被围攻者势力不同。三人局仍可能满足这些关系。
  例如，三名存活角色的势力依次为魏、蜀、魏，蜀角色的上下家都是魏，可构成围攻。能否发动相应效果，还取决于该阵法技是否已有效及是否到达其时机。
variant: 群狼环鼎
