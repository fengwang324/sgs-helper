id: faq_rule_flow_loselife
question: 失去体力事件的结算流程是怎样的？
answer: |-
  失去体力结算中有：失去体力时，失去体力后两个时机。
  （1）失去体力时：能发动的技能：【黄巾天兵符②】。
  发动技能后若防止失去体力，失去体力结算直接结束。
  如果没有防止失去体力，进行扣减体力结算。
  （2）失去体力后：能发动的技能：【诈降】。
  至此失去体力结算完毕。
