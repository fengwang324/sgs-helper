id: faq_002
question: 两张武将的半鱼怎么计算角色体力？
answer: |-
  将两张武将牌上的阴阳鱼相加，每条完整阴阳鱼计一点体力，两个半条合成一点；相加后剩余的单独半条不计入体力上限。开局体力等于这样得到的体力上限。
  例如，一张一点半、一张两点，开局为三点体力、三点上限；两张都是一点半，开局同样为三点，但没有剩余半条。
  若相加后有剩余半条，首次两张武将牌均明置时获得一个“阴阳鱼”标记，而非立即摸牌。出牌阶段可以弃置该标记摸一张牌；也可以在弃牌阶段弃置它，令本回合手牌上限加二。标记用掉后不因重新暗置、明置而重复领取。
variant: 群狼环鼎
