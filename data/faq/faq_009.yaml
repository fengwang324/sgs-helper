id: faq_009
question: 八人局，第五个亮某势力的角色会怎样？
answer: |-
  在没有已明置的同势力君主等特殊情况时，是。八人局同一势力人数超过开局人数的一半时，确定势力的新角色成为野心家；前四名魏势力角色已确定势力后，第五名原本将确定为魏的角色成为野心家。
  这里用的是开局八人的一半，不会因为已有角色死亡就把阈值改成当前存活人数的一半。因这一人数规则成为野心家后，也不因后来人数减少自动恢复原势力。
  若有已明置的魏君主存活，君主规则会使本来因人数过多成为野心家的魏角色保持或恢复魏势力，不能仍直接套用“第五个一定是野心家”。
variant: 群狼环鼎
