id: faq_ruling_skill_qian_xin_1
question: 【潜心】此流程即“亮出牌堆顶的一张牌，若此牌不为此类别/颜色，且若牌堆有牌或弃牌堆里有此类别/颜色的牌，你重复此流程”
answer: 此流程即“亮出牌堆顶的一张牌，若此牌不为此类别/颜色，且若牌堆有牌或弃牌堆里有此类别/颜色的牌，你重复此流程”。
