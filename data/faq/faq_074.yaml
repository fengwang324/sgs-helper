id: faq_074
question: 全暗角色杀死别人能拿击杀奖励吗？
answer: |-
  没有。击杀时两张武将均暗置、未确定势力的角色，不执行击杀奖惩：击杀敌方不摸奖励牌，击杀同牌面势力的角色也不执行同势力击杀的弃牌惩罚。
  不能在奖惩已经判断完毕后再亮将，补领这一击杀的摸牌。只明置一张武将、已确定势力的角色则不是全暗，应按当时势力判断正常奖惩。
  被杀者全暗与击杀者全暗也不同：被杀者死亡会展示武将、确定势力，以供已确定势力的击杀者计算奖惩。
