id: faq_060
question: 伤害来源与造成伤害的牌是一回事吗？
answer: |-
  不是。伤害来源是角色，不是杀、锦囊或装备牌；牌或技能决定伤害的渠道，伤害还具有属性和伤害值。
  例如，甲使用火杀对乙造成一点伤害，来源为甲，渠道为这张火杀，属性为火焰，伤害值为一。写“伤害来源”的效果应指向甲；写“此杀的使用者”的效果则按这张杀的使用者判断。
  来源与使用者被其他规则改成不同角色时，不能用“都是这张杀造成的”将两者混同。没有来源的伤害也不能把牌本身补成来源。
variant: 群狼环鼎
