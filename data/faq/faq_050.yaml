id: faq_050
question: 没有九变奇珍牌时，赋礼能否只跳过摸牌阶段？
answer: |-
  按所引玩家 FAQ，可以选择跳过摸牌阶段，但没有加入九变篇、没有可取得的奇珍牌时，不会获得奇珍牌。
  不能因为没有奇珍就把已选择跳过的摸牌阶段恢复，也不能改为额外摸普通牌补偿；事件没有给出这种补偿效果。
  这是玩家对无九变环境的补充解释，现有手册未单独裁定这一情形。
