id: faq_004
question: 准备阶段和出牌阶段都能任意亮将吗？
answer: |-
  不能在任意时点随意亮将。手册给出的明置机会为：
  1. 自己的准备阶段，可以明置一张或两张武将牌。
  2. 需要发动暗置武将牌上的技能时，可以明置对应武将牌并发动该技能，仍须满足技能的发动时机、条件和消耗。
  3. 自己的出牌阶段，可以明置具有锁定技的暗置武将牌。
  因此，“在出牌阶段”本身不等于可以自由明置任何武将。若没有相应锁定技，也未到所要发动技能的合法时机，不能仅以想亮将为由明置。
variant: 群狼环鼎
