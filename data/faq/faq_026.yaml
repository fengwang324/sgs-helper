id: faq_026
question: 已经开始翻副将，看到不喜欢的能撤销吗？
answer: |-
  不能。决定执行变更副将后，从剩余武将牌中逐张亮出，直到出现第一张符合该次变更条件的武将，就必须用它作新副将，不能因不满意而取消，也不能跳过它继续挑选。
  普通已确定势力角色以第一张同势力武将为新副将；未确定势力角色及牌面为野心家的主将，所引玩家解释采用第一张非野心家武将。这两类的补充筛选办法未在手册中明确，不能自行改成任意选将。
  前面亮出的未被选中武将牌洗混置于武将牌堆底。原副将如何归置，手册同页措辞有冲突；配合当前版本讲解，采用移出游戏，不把原副将混回牌堆。
variant: 群狼环鼎
