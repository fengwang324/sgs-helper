id: faq_059
question: 受到属性伤害到底在扣血前还是结束时解除连环？
answer: |-
  现有来源确实采用不同的精确时点，不能说扣血前与伤害结束时总是没有区别。
  2014 年通用规则的流程是：属性伤害照常扣减体力、插入可能的濒死等处理；到这次伤害结算结束时，若受伤者存活，重置其横置武将牌；伤害结算结束后再对其他连环角色依行动顺序传导。是否需要重置、是否启动传导，依据受伤者扣减体力前的连环状态判断；首次受伤者死亡也不当然取消传导。
  中郎将笔记的修订流程改为扣减体力前先重置，传导仍在伤害结算结束后进行。若中间有检查横置状态的技能，两种时点可能改变结算结果。
  群狼环鼎手册未细化这一时点，现有证据不能确定它采用哪一套。涉及这类技能时，应先明确本局采用的完整流程；两套流程都不能把同一批连环伤害再次作为新的起点反复传导。
variant: 群狼环鼎
