id: faq_ruling_skill_qiu_yuan_2
question: 【求援】若此牌不为【闪】且该角色是此【杀】的使用者使用此【杀】的合法目标（不进行使用牌的距离合法性检测），其也成为此【杀】的目标（无论是第几次），将从“指定目标后”开始
answer: |-
  若此牌不为【闪】且该角色是此【杀】的使用者使用此【杀】的合法目标（不进行使用牌的距离合法性检测），其也成为此【杀】的目标（无论是第几次），将从“指定目标后”开始参与使用流程。
  例如：伏皇后（旧将）对只有一张手牌的诸葛亮（标）发动【求援】，诸葛亮将最后一张手牌【桃】交给伏皇后，则受到【空城】的影响不执行诸葛亮成为此【杀】的目标的效果，【求援】结算完毕。
