id: faq_040
question: 抢到奇珍是直接装备吗？
answer: |-
  默认加入获得者的手牌，不直接放入装备区。奇珍规则只写“获得”，没有写“使用”“装备”或“置入装备区”。
  例如，从受伤角色装备区获得九州鼎，应将它移入自己的手牌。之后要让它成为自己的装备，须在允许使用装备牌的时机合法使用；不能在伤害结算中因获得它就直接替换自己的装备。
  该牌离开原角色装备区时，相关失去装备的效果仍按实际移动判断。
variant: 群狼环鼎
