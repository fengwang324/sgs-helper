id: faq_051
question: 九变环境加入太平要术，该替换哪张牌？
answer: |-
  现有手册只明确了旧配牌环境中的对应：太平要术替换势备篇的惊帆；同时，九变篇不能与势备篇混用。因此九变环境已经没有那张惊帆可按旧表替换。
  所引玩家 FAQ 的处理是：加入九变篇时，太平要术不再替换任何牌。依这一解释，不删五谷丰登，也不删巧取豪夺。
  所引来源没有支持“替换红桃三五谷丰登”。九变环境中追加太平要术的配牌口径目前仍只有玩家解释，不能写成手册明确规定。
