id: faq_ruling_skill_qiu_yuan_1
question: 【求援】另一名其他角色是此【杀】的使用者使用此【杀】的合法目标（不进行使用牌的距离合法性检测），才能执行也成为此【杀】的目标（无论是第几次）的目标
answer: |-
  另一名其他角色是此【杀】的使用者使用此【杀】的合法目标（不进行使用牌的距离合法性检测），才能执行也成为此【杀】的目标（无论是第几次）的目标。若执行了此效果，其将从“指定目标后”开始参与使用流程。
  例如：伏皇后对没有手牌的诸葛亮（标）发动【求援】，诸葛亮无法执行【求援】的任何一项效果。
  例如：太史慈发动【天义】拼点赢后，对大乔和伏皇后（按行动顺序排列）使用【杀】，大乔在成为目标时对伏皇后发动【流离】后就不是此【杀】的目标了，伏皇后在成为此【杀】的新目标时对大乔发动【求援】，大乔成为此【杀】的新目标但不会出现“成为目标时”。
  例如：太史慈发动【天义】拼点赢后，对伏皇后和汉献帝（按行动顺序排列）使用【杀】，伏皇后在成为目标时对汉献帝发动【求援】，汉献帝第二次成为此【杀】的目标但不会出现“成为目标时”。
mode: identity
source:
  type: official_rule
  reference: https://gltjk.com/sanguosha/rules/
