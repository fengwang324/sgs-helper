id: faq_057
question: 一次受到三点伤害，是三次受伤事件吗？
answer: |-
  算一次伤害，伤害值为三。是否能发动三次技能，要看技能按“伤害次数”还是按“每一点伤害”计数。
  写“受到伤害后”的普通一次响应，通常在这一次伤害后判断一次；写“每受到一点伤害后”的技能，才按实际受到的三点分别计数。
  奇珍夺取属于每次符合条件的杀伤害后获得一张，不能因这次伤害值为三就拿三张。
variant: 群狼环鼎
