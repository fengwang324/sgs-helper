id: faq_rule_flow_recoverlife
question: 回复体力事件的结算流程是怎样的？
answer: |-
  回复结算中有：确定回复数值、回复体力后两个时机。
  （1）确定回复数值：能产生影响的技能：【救援】。
  然后角色按照此数值回复体力。
  （2）回复体力后：能发动的技能：【伤逝】、【淑慎】、【恩怨（旧将）①】。
  至此回复体力结算完毕。
