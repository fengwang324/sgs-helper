id: faq_003
question: 是否必须开局看下家的副将？
answer: |-
  不必须。这是须在开局前由所有玩家共同同意采用的可选规则。
  采用时，每人选好主、副将后，在发起始手牌之前，查看自己下家的副将牌。游戏按逆时针方向进行，下家是右手边的下一名玩家。该操作只允许查看副将，不允许查看主将，也不等于将被查看的副将明置给全场。
  未共同采用时，不进行这次查看。
variant: 群狼环鼎
