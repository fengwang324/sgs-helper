id: faq_032
question: 七人局还剩四人，没有队友，会自动鏖战吗？
answer: |-
  不进入。开局为七人或更少时，鏖战的人数门槛是存活角色不超过三名，不是四名。
  七人局剩四人，即使彼此势力不同，也还未满足人数条件。剩三人或更少、且场上没有至少两名同势力角色时，才从新的回合开始进入鏖战。
variant: 群狼环鼎
