id: faq_029
question: 移除武将与变更副将是一样的吗？
answer: |-
  区别在于替换结果：
  1. 移除武将：将被移除的武将牌移出游戏，以同势力、同性别的士兵牌替代。士兵没有技能，角色体力上限不变。
  2. 变更副将：从剩余武将牌中逐张亮出，使用第一张符合条件的武将替换副将；新副将仍是一张具有自身技能的武将牌，原副将按当前版本移出游戏。体力上限不变，也不重新取得珠联璧合、阴阳鱼奖励。
  因此，“移除副将”不等于“获得一次新的副将选择”，不能把本应变成士兵的操作擅自改为翻取新武将。
variant: 群狼环鼎
