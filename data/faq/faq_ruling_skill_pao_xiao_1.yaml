id: faq_ruling_skill_pao_xiao_1
question: |-
  【咆哮】使用【杀】指定A为目标后触发【咆哮②】，你无视A的防具的效果持续到：
  此【杀】因对A无效而终止使用结算
answer: |-
  你使用【杀】指定A为目标后触发【咆哮②】，你无视A的防具的效果持续到：
  此【杀】因对A无效而终止使用结算。
  此【杀】被A使用的【闪】抵消。
  此【杀】对A进行使用结算造成的伤害，在伤害结算中防止此伤害。
  此【杀】对A进行使用结算造成的伤害，在伤害结算中计算出最终的伤害值。
