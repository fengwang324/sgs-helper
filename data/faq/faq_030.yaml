id: faq_030
question: 达到鏖战人数条件时，立即中断当前结算翻事件吗？
answer: |-
  不会立即打断当前回合。先检查是否同时满足：
  1. 存活角色不超过四名；若开局人数为七人或更少，则须不超过三名。
  2. 场上没有至少两名同势力的存活角色。
  满足条件后，从一个新的回合开始进入鏖战，当前回合及其中正在进行的牌、技能结算先继续完成。
  进入后持续到游戏结束，不因后来出现同势力队友而退出。鏖战中桃只能当酒使用，事件牌在每轮开始时翻开，而非触发鏖战条件就立即插入翻事件。
variant: 群狼环鼎
