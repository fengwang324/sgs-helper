id: faq_011
question: 全暗角色能直接跟队友一起获胜吗？
answer: |-
  两张武将均暗置的角色不能仅凭暗置牌面与获胜势力相同而获得势力胜利。正常势力胜利要求存活角色已归于同一势力，未确定势力的角色不能直接算作该势力成员。
  另须检查暗置的野心家主将：若该角色仅明置了副将，正因暂按副将势力计算而准备结束游戏，须先明置野心家主将、暴露野心，不能以副将势力直接混入胜利。
  暴露野心后，如满足条件则处理拉拢人心；之后重新检查胜利条件。
variant: 群狼环鼎
