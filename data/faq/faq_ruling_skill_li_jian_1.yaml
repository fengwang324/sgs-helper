id: faq_ruling_skill_li_jian_1
question: 【离间】在选择目标时须决定效果中使用【决斗】的角色，且另一名角色必须是该角色使用【决斗】的合法目标
answer: 你在选择目标时须决定效果中使用【决斗】的角色，且另一名角色必须是该角色使用【决斗】的合法目标。
