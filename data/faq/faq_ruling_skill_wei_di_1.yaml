id: faq_ruling_skill_wei_di_1
question: |-
  【伪帝】若主公拥有主公技，你也视为拥有该技能且该技能有效；若主公失去主公技，你也不再视为拥有该技能
answer: |-
  若主公拥有主公技，你也视为拥有该技能且该技能有效；若主公失去主公技，你也不再视为拥有该技能。
  例如：主公为刘禅时，袁术视为拥有【若愚】且【若愚】有效：
  刘禅先触发【若愚】，则增加1点体力上限，回复1点体力，获得【激将】，此时袁术因【伪帝】视为拥有【激将】且可以发动（若此时刘禅失去所有技能，则袁术也不再视为拥有【若愚】和【激将】）。袁术再触发【若愚】，则增加1点体力上限，回复1点体力，获得【激将】且可以发动（若此时刘禅失去所有技能，则袁术不再视为拥有【若愚】，获得的【激将】不会失去，但是由于刘禅已经失去了【激将】，袁术不可以发动）。
  袁术先触发【若愚】，则增加1点体力上限，回复1点体力，获得【激将】但无论任何情况都不可以发动，因为此【激将】并非你受到【伪帝】影响视为拥有的主公技，不过若刘禅之后失去了所有技能，则袁术不在拥有【若愚】，但此不可以发动的【激将】不会失去。刘禅再触发【若愚】，则增加1点体力上限，回复1点体力，获得【激将】，此时袁术因【伪帝】可以发动【激将】（若此时刘禅失去所有技能，则袁术也不再拥有【若愚】，获得的【激将】虽然不会失去，但是由于刘禅已经失去了【激将】，袁术不可以发动）。
