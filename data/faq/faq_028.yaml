id: faq_028
question: 新版变更副将还是三选一、最多两次吗？
answer: |-
  不是。群狼环鼎的通用变更副将流程是逐张亮出剩余武将牌，取第一张符合条件的武将，不能从三张中任选；通用规则也没有“每名角色整局最多两次”的限制。
  具体牌或技能可以另行限制使用次数。例如，遁甲天书自身规定的出牌阶段次数限制，约束的是该装备效果，不能扩展成所有方式变更副将的整局次数限制。
  每次变更都不改体力上限、不再领取珠联璧合或阴阳鱼奖励，原副将移出游戏。
variant: 群狼环鼎
