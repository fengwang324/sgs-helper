id: faq_025
question: 变更副将会更改体力上限吗？
answer: |-
  不改变。变更副将后，角色的体力上限保持原值，不重新按新主、副将的阴阳鱼计算。
  例如，原体力上限为三，新副将使牌面阴阳鱼相加看似达到四，体力上限仍为三，也不因此回复体力。变更副将不重新领取珠联璧合或剩余半条阴阳鱼的标记。
  变更副将与君主替换是不同操作；君主替换时可能提高体力上限并回复体力，不能套到变更副将上。
