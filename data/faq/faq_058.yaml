id: faq_058
question: 属性伤害被完全防止，还会触发连环吗？
answer: |-
  不会。属性伤害被完全防止，或伤害值被减为零而没有实际受到伤害时，不因这次伤害触发连环传导，也不因这次伤害解除受伤角色的连环状态。
  例如，横置角色防止了火杀的全部伤害，其他横置角色不因此受传导伤害；它自身仍保持横置，除非另一个效果明确重置它。
  若仍实际受到至少一点属性伤害，才继续判断解除连环和传导；只减伤而未减至零，并不等于完全防止。
variant: 群狼环鼎
