id: faq_069
question: 装备武器把攻击范围变三，顺手牵羊也能三距离使用吗？
answer: |-
  不能仅凭武器攻击范围为三，就对距离三的角色使用顺手牵羊。攻击范围与角色间距离是两个数值：武器通常提高使用杀可选目标的攻击范围，不减少与目标的实际距离。
  顺手牵羊要检查其自身要求的距离，通常为一以内。双方实际距离为三、仅攻击范围为三时，可因攻击范围满足而使用杀，但不能据此使用顺手牵羊。
  距离另按存活座位间较短路径以及坐骑、技能等距离修正计算；已死亡角色不再占据距离上的座位。
variant: 群狼环鼎
