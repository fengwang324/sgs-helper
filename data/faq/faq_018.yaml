id: faq_018
question: 君主可以中途任意变身吗？
answer: |-
  不能。君主替换的机会仅在自己的第一个回合开始时：主将仍暗置，且存在与主将同名的君主武将牌，才可以明置主将并将其替换为对应君主。
  若第一个回合开始前主将已经明置，或当时放弃替换，不能在后续回合、出牌阶段或其他人的回合补做这次变身。副将同名也不能替代主将满足条件。
  替换后若体力上限提高，回复与提高量相同的体力；明置的君主不能再被暗置。
