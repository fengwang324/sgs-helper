id: faq_068
question: 判定区里的延时锦囊属于“你的牌”吗？
answer: |-
  判定区的牌不算角色拥有的牌；角色拥有的牌为手牌和装备区里的牌。口语中的“你的判定牌”也不改变判定牌的归属。
  因此，效果要求选择“你的一张牌”或计算“失去你拥有的牌”时，不能默认将判定区里的乐不思蜀、闪电等包括进去。
  若效果明确写“区域里的牌”并包括判定区，或专门允许移动判定区的牌，才按那个范围处理；不能把“拥有的牌”和“某区域里的牌”混用。
variant: 群狼环鼎
