id: faq_042
question: 掠闪抢的是伤害来源的奇珍吗？
answer: |-
  掠闪获得的是这张杀的使用者装备区里的一张奇珍牌，不是另行指定的伤害来源的装备。
  处理顺序是：先抵消以你为目标的杀；然后你可以从该杀使用者装备区里选择一张奇珍牌获得。没有奇珍牌时仍能抵消杀，只是不获得牌。
  这个效果不要求杀已经造成伤害。杀被掠闪抵消后仍可夺取，且所得牌默认进入你的手牌。若某效果使杀的使用者与伤害来源不同，掠闪依然按使用者选牌。
