id: faq_079
question: 先驱标记是亮将后立即摸到四张吗？
answer: |-
  不是。全场首位明置武将牌的角色先获得一个“先驱”标记，获得时不立即将手牌补至四张，也不立即查看别人的武将。
  在自己的出牌阶段弃置该标记时，一并执行：将手牌摸至四张，并观看一名其他角色的一张武将牌。查看的是自己选择的那一张，不是两张都看，也不等于向全场明置。
  例如，当前两张手牌则摸两张；当前五张则不摸也不弃，但仍可执行查看。标记被弃置后不能重复使用。
variant: 群狼环鼎
