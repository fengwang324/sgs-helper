id: faq_ruling_skill_hua_shen_1
question: 【化身】选择一张化身牌即将此化身牌置于武将牌旁的同时将原化身牌（若有）扣置入化身牌堆，同时声明此武将牌的一项技能（限定技、觉醒技、主公技以及能令你拥有没有用引号标注的技
answer: |-
  选择一张化身牌即将此化身牌置于武将牌旁的同时将原化身牌（若有）扣置入化身牌堆，同时声明此武将牌的一项技能（限定技、觉醒技、主公技以及能令你拥有没有用引号标注的技能的技能除外），同时：
  若你未因发动【化身】而获得过此技能，则你获得此技能，同时令你因发动【化身】而获得的其他技能无效。
  若你因发动【化身】而获得过此技能，则你令此技能有效，同时令你因发动【化身】而获得的其他技能无效。
  例如：左慈在回合开始时发动【化身②】拥有周泰（旧风）的【不屈】，于出牌阶段内发动【不屈】，武将牌上共有X张不同点数的牌（体力为1-X），在回合结束后发动【化身②】拥有【急救】，进入濒死状态（体力未变化），进行濒死结算，此时不属于任何角色的回合，轮到左慈进行响应时，左慈可以发动【急救】对自己使用【桃】。
  例如：左慈发动【化身②】不能拥有【孝德】/【伪帝】。
