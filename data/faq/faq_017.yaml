id: faq_017
question: 有并列人数最多的势力时，谁算大势力？
answer: |-
  可以同时有多个大势力。某势力须有至少两名存活角色，且人数达到当前各势力的最高值，才是大势力；并列最多的势力都算大势力。
  例如，魏、蜀各两人，吴一人：魏、蜀都为大势力，吴为小势力。只剩魏两人、蜀两人且没有其他角色时，全场只有大势力，没有小势力。
  存在大势力时，未确定势力的角色也按小势力处理；若所有势力都只有一人，则没有大势力，不能凭“并列最多一人”把它们算成大势力。
variant: 群狼环鼎
