id: faq_007
question: 先亮女性副将，之后亮男性主将，性别怎么变？
answer: |-
  先只明置女性副将时，角色视为女性；随后明置男性主将，两张均明置，角色改为男性。
  性别按当前明置状态确定：只有一张明置就按该张，主、副将都明置就按主将。不能在主将明置后继续以“副将是女性”为由把角色视为女性。
variant: 群狼环鼎
