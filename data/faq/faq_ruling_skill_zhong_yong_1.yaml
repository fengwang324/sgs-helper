id: faq_ruling_skill_zhong_yong_1
question: 使用因执行【忠勇】“对该目标角色使用【杀】（无距离限制）”的效果而使用的【杀】选择目标时，除该目标角色外的角色不是合法目标
answer: |-
  你使用因执行【忠勇】“对该目标角色使用【杀】（无距离限制）”的效果而使用的【杀】选择目标时，除该目标角色外的角色不是合法目标。
  例如：周仓对大乔使用【杀】，大乔使用【闪】进行响应，当此【杀】被此【闪】抵消时，周仓发动【忠勇】将此【闪】交给小乔，然后周仓只可以对大乔使用【杀】，但大乔可以发动【流离】，因为此时【忠勇】已经不能对周仓使用此【杀】的目标的合法性产生影响了。
