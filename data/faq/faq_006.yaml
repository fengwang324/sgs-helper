id: faq_006
question: 全暗角色算男还是女？
answer: |-
  没有。主、副将都暗置的角色没有性别，也没有已确定的势力，不能因为玩家本人或暗置武将的性别而被当作男性、女性。
  只明置一张武将牌时，角色性别按这张牌确定；两张都明置时，角色性别按主将确定。涉及指定男性／女性的目标或效果时，应以当时已经明置的状态判断。
variant: 群狼环鼎
