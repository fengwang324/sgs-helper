id: faq_ruling_skill_hu_jia_1
question: |-
  【护驾】声明使用【闪】只能声明使用不确定花色的【闪】，即你开始一个特殊的使用【闪】的流程：首先你在“选择目标时”声明使用不确定花色的【闪】，同时选择你使用【闪】
answer: |-
  你发动【护驾】声明使用【闪】只能声明使用不确定花色的【闪】，即你开始一个特殊的使用【闪】的流程：首先你在“选择目标时”声明使用不确定花色的【闪】，同时选择你使用【闪】的目标。然后其他魏势力角色依次决定如何进行响应，一旦有一名角色打出【闪】即在开始打出流程的同时终止响应的流程，打出流程完毕后不将此牌置入弃牌堆。接着继续进行特殊的使用流程，进入“使用牌时”，视为你成功使用了与该角色打出的【闪】牌面信息和对应的实体牌都相同的【闪】，之后此特殊的使用流程开始按照正常的使用流程进行。若没有魏势力角色打出【闪】进行响应，则终止特殊的使用流程，视为你没有使用过此【闪】。
