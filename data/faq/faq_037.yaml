id: faq_037
question: 九变篇可以和势备篇一起洗入游戏牌堆吗？
answer: |-
  不能将九变篇与势备篇游戏牌混用。群狼环鼎手册明确九变篇不能与势备篇混用；九变篇讲解给出的加入方式是标准版一百零八张配九变篇五十二张。
  因此，不能在这一百六十张基础上再保留势备篇的游戏牌，也不能因为某张牌单独有用就自行从势备篇插入。君主装备等另有加入方式的组件，仍须按其明确的组件规则处理，不能据此把整套势备篇混回。
variant: 群狼环鼎
