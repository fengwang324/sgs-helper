id: faq_ruling_skill_hong_fa_1
question: 【弘法】“黄巾天兵符”是你的武将技能
answer: |-
  “黄巾天兵符”是你的武将技能。
  “黄巾天兵符”
  你执行的效果中的“群势力角色数”+X（X为不大于“天兵”数的自然数）；每当你失去体力时，你可以将一张“天兵”置入弃牌堆，防止此失去体力；与你势力相同的角色可以将一张“天兵”当【杀】使用或打出。
