id: faq_046
question: 天禄丢失后重新获得，技能次数和已选技能都重置吗？
answer: |-
  按所引玩家 FAQ，可以重新计算新获得的君主技的使用记录。该解释将每次重新获得的君主技视为新的独立实例，旧实例的每轮次数及“本局未被选择过”记录不延续到新实例。
  例如，失去天禄后重新获得，再取得八荒死士令，可按新实例重新判断选择及使用次数。
  这是玩家解释，现有手册没有给出这一重置裁定；也不能推广为所有技能只要暂时失效，就自动刷新次数。
