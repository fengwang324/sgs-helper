id: faq_087
question: |-
  【酒】（使用方法①）的效果值是什么，增加后如何影响下一张【杀】？
answer: |-
  【酒】（使用方法①）的作用效果中的“下一张【杀】的伤害值基数+X”中的“X”称为“【酒】（使用方法①）的效果值”。若一名角色执行“【酒】（使用方法①）的效果值+Y”，则此【酒】（使用方法①）的作用效果改为：目标对应的角色于此回合内使用的下一张【杀】的伤害值基数+Z（Z=此【酒】（使用方法①）当前的效果值+Y）。
variant: 群狼环鼎
