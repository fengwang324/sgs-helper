id: faq_010
question: 两名野心家能作为队友共同获胜吗？
answer: |-
  不能仅因为都是野心家就算队友。野心家分别视为独立势力，两名野心家之间也是势力不同，通常各自争取胜利。
  野心家武将的“拉拢人心”另有组队机制：暴露野心时，若仍有“野心家”标记且存活角色不少于三名，可以征求其他角色加入；按行动顺序响应，至多一名加入，野心家和君主角色不能加入。加入者放置相应标记，与拉拢者共同取得胜利，并可将手牌补至四张、回复一点体力。
  因此，可共享胜利的是按拉拢规则建立的同一阵营，不是全场所有野心家。
variant: 群狼环鼎
