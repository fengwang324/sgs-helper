id: faq_ruling_skill_hu_jia_2
question: 【护驾】声明打出【闪】对某事件进行响应即你开始一个特殊的打出【闪】的流程：你在声明打出【闪】后其他魏势力角色依次决定如何进行响应，一旦有一名角色打出【闪】即在开？
answer: 你发动【护驾】声明打出【闪】对某事件进行响应即你开始一个特殊的打出【闪】的流程：你在声明打出【闪】后其他魏势力角色依次决定如何进行响应，一旦有一名角色打出【闪】即在开始打出流程的同时终止响应的流程，打出流程完毕后不将此牌置入弃牌堆。接着继续进行特殊的打出流程，进入“打出牌时”，视为你成功打出了与该角色打出的【闪】牌面信息和对应的实体牌都相同的【闪】，之后此特殊的打出流程开始按照正常的打出流程进行。若没有魏势力角色打出【闪】进行响应，则终止特殊的打出流程，视为你没有打出过此【闪】。
mode: identity
