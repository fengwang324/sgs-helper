id: faq_ruling_skill_gu_huo_5
question: 【蛊惑】此牌在亮出前视为没有颜色（即你在选择目标时此牌是视为没有颜色的）；在亮出后（若仍进行结算）以实际花色进行结算
answer: |-
  此牌在亮出前视为没有颜色（即你在选择目标时此牌是视为没有颜色的）；在亮出后（若仍进行结算）以实际花色进行结算。
  例如：马岱对于吉发动【潜袭】，此回合内于吉可以用任意手牌发动【蛊惑】，因为于吉在声明使用的牌的牌名时此牌视为没有颜色，不会受到【潜袭】效果的限制。
  例如：于吉用红桃的【杀】/【决斗】发动【蛊惑】对孙策使用【杀】/【决斗】，在选择孙策为目标时，此牌暂时视为没有颜色，在亮出后此牌恢复实际花色，孙策在成为目标后可以发动【激昂】。
mode: identity
