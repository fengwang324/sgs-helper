id: faq_001
question: 基础开局发几张武将、几张手牌？
answer: |-
  基础开局每人获得七张武将牌；九至十二人局改为每人五张。每人从中选两张，选择主、副将后将其暗置；靠近体力牌的是主将，另一张是副将。选好武将、确定初始体力后，每人获得四张起始手牌。
  选将时须满足以下条件：
  1. 普通组合：两张武将牌的势力相同，由玩家决定谁作主将、谁作副将。
  2. 双势力武将：只能作副将，不能作主将；主将的势力须属于副将标出的两个势力之一。游戏中该角色按主将势力处理；若先明置双势力副将，须如实声明暗置主将的势力，并遮住副将上未使用的势力。
  3. 野心家武将：只能作主将，不能作副将；可以搭配任意势力的非野心家武将作副将，不要求两张武将势力相同。仅明置副将时暂按副将势力处理；明置野心家主将后，该角色的势力为野心家。
  上述七张／五张指选将时发给玩家的候选武将数量，最终使用的仍是两张；四张指起始手牌数量。
