id: faq_085
question: |-
  杀造成伤害后，悲歌等伤后技能一定先于奇珍夺取吗？
answer: |-
  不能仅凭“武将技能优先”就断言所有伤害后技能一定先于奇珍夺取。该最高原则解决条文冲突，跨角色的同时机响应还涉及行动顺序；群狼环鼎手册没有明确奇珍基本规则在这个同时机中的插入位置。
  所引九变篇讲解给出一个玩家裁定：蔡文姬受到杀的伤害后，可以先弃置自己的奇珍装备发动悲歌，使伤害来源随后没有那张装备可取。这个例子表明作者采用先处理悲歌的口径，但不足以证明所有角色、所有伤害后技能都统一先于夺取。
  已能确定的是：夺取执行时，只能获得受伤角色装备区里仍存在的奇珍牌；已经因悲歌或其他效果弃置、移走的牌不能再取。
