id: faq_005
question: 暗将上的锁定技会强制让你亮将吗？
answer: |-
  不必须。暗置的武将牌视为没有技能，因此其锁定技在暗置时不强制发动，也不强制玩家为此明置。
  例如，伤害结算中满足了某暗置武将锁定技的条件，玩家可以保留暗置；若选择在该技能的合法时机明置对应武将，则获得该武将的技能，按明置后的技能说明处理。
  手册还允许在自己的出牌阶段明置具有锁定技的武将牌。锁定技明置后的强制性，与是否选择明置，是两个判断。
variant: 群狼环鼎
