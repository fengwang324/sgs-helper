id: faq_065
question: |-
  弃两张牌发动技能，能先弃一张触发摸牌，再拿新牌当第二张消耗吗？
answer: |-
  不能。一次发动要求“弃置两张牌”作为消耗时，须在发动时选出并同时支付两张合法的牌，不能把这次消耗拆成先弃一张、触发摸牌、再以新摸牌补第二张。
  若当时只有一张可用于消耗的牌，就不满足发动条件，不能先付半份消耗等待补足。因同时弃置两张而产生的失去牌等事件，在这一消耗完成后按相应时机插入处理。
  只有条文明写“依次”或另行规定分步支付时，才按其规定逐项操作；“然后摸牌”是消耗之后的效果，不可用于凑齐此前的消耗。
variant: 群狼环鼎
