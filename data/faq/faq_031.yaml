id: faq_031
question: 八人局还剩四人，但仍有两名同势力角色，会鏖战吗？
answer: |-
  不进入。八人局剩四人满足人数条件，但还有两名同势力存活角色，不满足“没有至少两名同势力角色”的条件。
  鏖战要求人数条件和势力条件同时成立。之后若这两人中一人死亡，或势力变化使场上不再有同势力的两人，才重新检查；条件成立后从新的回合开始进入，不能在当前回合中途立即切换。
variant: 群狼环鼎
