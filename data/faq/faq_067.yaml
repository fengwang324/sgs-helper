id: faq_067
question: 展示最后一张手牌，就等于失去最后手牌吗？
answer: |-
  不等于。展示仅将牌的信息公开，牌仍在原来的手牌区，没有因此被弃置、交给他人或移出手牌区。
  因此，展示最后一张手牌后，手牌数仍为一，不能仅凭展示发动“失去最后的手牌”或“没有手牌”相关效果。
  若展示之后另有“交给”“弃置”“使用”等操作，再按该次实际移动判断何时失去手牌；不能提前到展示时触发。
variant: 群狼环鼎
