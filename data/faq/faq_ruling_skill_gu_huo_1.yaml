id: faq_ruling_skill_gu_huo_1
question: 【蛊惑】声明使用的牌的牌名即你开始一个特殊的使用流程：首先你在“选择目标时”声明使用的牌的牌名，同时为此牌选择合法目标（此牌此时视为没有颜色），同时将一张手牌扣
answer: |-
  你发动【蛊惑】声明使用的牌的牌名即你开始一个特殊的使用流程：首先你在“选择目标时”声明使用的牌的牌名，同时为此牌选择合法目标（此牌此时视为没有颜色），同时将一张手牌扣置入处理区。然后其他角色依次决定是否质疑。若没有角色质疑，你亮出之，确定除牌名外的所有牌面信息，然后对你声明牌名时选择的目标再次进行合法性检测，取消不合法的目标，若此牌仍有合法目标，进入“使用牌时”，之后此特殊的使用流程开始按照正常的使用流程进行。一旦有一名角色质疑即终止质疑的流程，你亮出之。若验明为真，质疑的角色获得“缠怨”，然后后续流程同没有角色质疑的情况。若验明为假，终止此特殊的使用流程，你将之置入弃牌堆：若你是在出牌阶段的空闲时间点发动【蛊惑】使用牌，则视为你没有使用过为你声明的牌名的牌；若你是对某事件进行响应需要使用牌，则视为你没有决定如何进行响应。
  例如：贾诩发动【乱武】，轮到于吉进行响应时，于吉发动【蛊惑】将一张【闪】当【杀】对A使用，被质疑后验明为假，于吉视为没有决定如何进行响应，可以对此时距离最小的一名角色（如果A存活可以选择A为目标）使用【杀】进行响应。
mode: identity
