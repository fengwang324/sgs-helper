id: faq_033
question: 进入鏖战后重新出现队友，要退出鏖战吗？
answer: |-
  不退出。鏖战一旦开始，持续到游戏结束；进入条件只决定何时开始，不是每个回合都要持续满足的维持条件。
  例如，进入后因亮将、君主规则或其他势力变化出现同势力队友，仍继续执行桃只能当酒使用、每轮翻事件等鏖战规则，不能恢复普通桃的用法。
variant: 群狼环鼎
