id: faq_070
question: 决斗中打出的杀，消耗出牌阶段通常的一次杀吗？
answer: |-
  不消耗。决斗要求的杀是“打出”以响应锦囊效果，不是自己的出牌阶段主动“使用杀”。
  例如，你在出牌阶段使用决斗，结算中打出两张杀响应，若本阶段此前尚未主动使用杀，决斗结算后仍有通常的一次主动使用杀机会；若此前已用过，则不会因决斗中的打出而重新获得一次机会。
  其他技能若分别统计“使用杀”或“打出杀”，也应按实际操作区分，不能将所有离开手牌的杀都算作使用。
variant: 群狼环鼎
