id: faq_ruling_skill_gu_huo_7
question: 【蛊惑】被质疑，亮出验明后不进行结算置入弃牌堆：若你是在出牌阶段的空闲时间点发动【蛊惑】使用牌，则视为你没有使用过为你声明的牌名的牌；若你是对某事件进行响应需要
answer: |-
  你发动【蛊惑】被质疑，亮出验明后不进行结算置入弃牌堆：若你是在出牌阶段的空闲时间点发动【蛊惑】使用牌，则视为你没有使用过为你声明的牌名的牌；若你是对某事件进行响应需要使用牌，则视为你没有决定如何进行响应。
  例如：贾诩发动【乱武】，轮到于吉进行响应时，于吉用非红桃【杀】发动【蛊惑】对A使用【杀】，A质疑后无论是否死亡，于吉都视为没有决定如何进行响应，可以再次发动【蛊惑】对此时距离最小的一名角色（如果A存活可以选择A为目标）使用【杀】进行响应。
