id: faq_014
question: 野主将只亮副将时，势力就已经是野心家吗？
answer: |-
  只明置非野心家副将、野心家主将仍暗置时，角色暂按副将的势力处理。之后明置野心家主将，角色的势力变为野心家，并获得“野心家”标记。
  例如，野心家主将搭配蜀副将，先只亮蜀副将时暂按蜀处理；亮出野心家主将后，不能继续以蜀身份与蜀角色共同获胜。
  若游戏即将因该角色暂归副将势力而结束，还须先亮出野心家主将、处理暴露野心及可能的拉拢，再检查胜利。
variant: 群狼环鼎
