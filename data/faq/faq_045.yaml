id: faq_045
question: 分道扬镳与同势力君主同时存在，谁优先？
answer: |-
  现有来源没有给出“分道扬镳改变势力”与“同势力君主存活时有君无野”的明确冲突裁定，不能据此断言一定是哪一项优先。
  已能确认的基础效果是：出牌阶段对一名其他同势力角色使用；你摸六张牌并交给目标三张，然后你变为野心家。没有合法的其他同势力目标时不能按这一用途使用；重铸则是弃置此牌、摸一张牌，不执行变为野心家的效果。
  待确认的是：已明置的同势力君主存活时，使用者是否仍变为野心家；若使用者就是君主，其原队友怎样处理。所引讲解明确提出了这些问题，却未给答案。尤其不能自行补出“非君主永久变野、君主自己变野而队友保持原势力”作为确定结论。
  这些特殊对局情形须先取得明确裁定或全桌约定；不能把候选处理当作官方结论。
variant: 群狼环鼎
