id: faq_ruling_skill_gu_huo_2
question: 【蛊惑】声明打出的牌的牌名对某事件进行响应即你开始一个特殊的打出流程：首先你在声明打出的牌的同时将一张手牌扣置入处理区，然后其他角色依次决定是否质疑？
answer: 你发动【蛊惑】声明打出的牌的牌名对某事件进行响应即你开始一个特殊的打出流程：首先你在声明打出的牌的同时将一张手牌扣置入处理区，然后其他角色依次决定是否质疑。若没有角色质疑，你亮出之，你亮出之，确定除牌名外的所有牌面信息，然后进入“打出牌时”， 之后此特殊的打出流程开始按照正常的打出流程进行。一旦有一名角色质疑即终止质疑的流程，你亮出之。若验明为真，后续流程同没有角色质疑的情况。若验明为假，终止此特殊的打出流程，你将之置入弃牌堆，视为你没有决定如何进行响应，你可以打出为你声明的牌名的牌进行响应。
