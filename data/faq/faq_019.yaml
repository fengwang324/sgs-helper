id: faq_019
question: 君主亮明以后，还能暗置吗？
answer: |-
  不能。君主武将牌一旦明置，手册规定不能再暗置。
  因此，不能借一般“暗置武将牌”的效果把已明置君主翻回暗置，也不能为了重新获得亮将奖励而主动将其暗置。选取可被暗置的武将牌时，应排除已明置的君主牌。
variant: 群狼环鼎
