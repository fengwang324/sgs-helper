id: faq_081
question: 阴阳鱼标记提高的手牌上限会一直保留吗？
answer: |-
  不是永久提高。弃牌阶段弃置阴阳鱼标记后，手牌上限只在本回合加二；回合结束后这次加成消失，标记也已被消耗。
  例如，本回合基础手牌上限为三，使用标记后本次弃牌按五计算；下个回合不再自动保持五，须重新按当时体力和其他实际生效的修正判断。
  另一个用途是在出牌阶段弃置标记摸一张牌。两种用途选其一，不能一枚标记既摸牌又加上限。
variant: 群狼环鼎
