id: faq_rule_flow_increaselifemax
question: 加体力上限事件的结算流程是怎样的？
answer: |-
  加体力上限结算中有：加体力上限前，加体力上限后两个时机。
  （1）加体力上限前：暂时没有作用。
  然后角色加体力上限。
  （2）加体力上限后：能发动的技能：【伤逝】、【威重】。
  至此加体力上限结算完毕。
