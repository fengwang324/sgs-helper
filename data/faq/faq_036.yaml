id: faq_036
question: 鏖战事件是每个回合翻一张吗？
answer: |-
  不是。鏖战期间每轮开始时翻开一张尚未翻开的事件牌，不是每名角色的回合开始都翻一张。同一轮的其他角色开始回合时，不重复翻牌；所有事件牌都翻开过后，将它们重新洗混，再继续翻取。
  进入鏖战的时点与每轮翻事件的时点分别判断，不能在当前回合刚满足鏖战条件时就立即翻牌。
  需确认的具体问题是“轮首怎样移动、轮首死亡怎么办、额外回合是否推进轮次”。现有手册和所引讲解没有完整定义这些边界；不能从“每轮开始”直接推出固定从1号位开始、死亡后顺延、额外回合不推进的一整套处理，涉及这些边界须先明确本局轮次约定。
