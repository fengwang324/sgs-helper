id: faq_012
question: 双势力武将能作主将吗？
answer: |-
  不能。双势力武将只能作副将；主将须选择其两个势力中的一个，角色势力按主将确定。
  例如，双势力副将标为魏／蜀，普通配将时可以搭配魏主将或蜀主将，不能搭配吴主将，也不能把这张双势力武将放在主将位置。
  若先明置双势力副将，须如实声明暗置主将的势力，并遮住另一个未使用的势力；不是亮副将时任意选一个势力。
variant: 群狼环鼎
