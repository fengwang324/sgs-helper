question: 【肉林】【肉林①】中目标角色依次使用的第一张【闪】对此【杀】无效，第二张【闪】对此【杀】有效；【肉林②】中你依次使用的第一张【闪】对此【杀】无效，第二张【闪】对此【杀】
answer: 【肉林①】中目标角色依次使用的第一张【闪】对此【杀】无效，第二张【闪】对此【杀】有效；【肉林②】中你依次使用的第一张【闪】对此【杀】无效，第二张【闪】对此【杀】有效。
