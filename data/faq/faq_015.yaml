id: faq_015
question: 使用势力锦囊时全暗，能拿额外势力效果吗？
answer: |-
  可以，但须在使用对应势力锦囊时明置武将并确定为该锦囊要求的势力，才有对应的额外效果。全暗角色可以利用这个使用时机明置一张武将牌，以取得符合条件的势力身份。
  若使用时仍未确定势力，或确定的势力不符，只执行锦囊的基础效果，不能凭暗置牌面声称享有势力加成，也不能等结算完再亮将补领加成。
  这类势力锦囊使用或弃置后移出游戏，不按普通锦囊放回弃牌堆循环使用。
