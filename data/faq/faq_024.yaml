id: faq_024
question: 阵法技短暂无效后，恢复时要再召唤才能生效吗？
answer: |-
  不须仅因阵法技曾短暂无效，就再召唤一次才能恢复效果。恢复后重新检查：技能是否有效、所需的队列或围攻关系是否成立，以及是否已经到达该技能的时机。
  持续型阵法效果在条件重新满足时恢复适用；触发型效果只能在恢复后的相应时机发动，不能补结算失效期间已经过去的触发。
  例如，队列中有人变为不同势力使条件消失，后来重新形成合格队列，应按当时关系判断效果；阵法召唤仍只是让符合条件的暗置角色选择亮将的操作，不是恢复技能的必付步骤。
variant: 群狼环鼎
