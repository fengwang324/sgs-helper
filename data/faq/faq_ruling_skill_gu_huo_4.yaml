id: faq_ruling_skill_gu_huo_4
question: 【蛊惑】使用牌在“选择目标时”须将之扣置入处理区，然后其他角色决定是否质疑，再亮出进行验明，（若有其他角色质疑）在处理完质疑的结果后若此牌仍进行结算，即进入使用？
answer: |-
  你发动【蛊惑】使用牌在“选择目标时”须将之扣置入处理区，然后其他角色决定是否质疑，再亮出进行验明，（若有其他角色质疑）在处理完质疑的结果后若此牌仍进行结算，即进入使用结算前的第二个时机即“使用牌时”。
  例如：全场共有八名角色时，于吉用红桃【五谷丰登】发动【蛊惑】使用【五谷丰登】，一名角色质疑失败后死亡，在【五谷丰登】选择所有角色为目标后，于吉亮出牌堆顶等同于全场角色数量的牌即七张。
