id: faq_038
question: 被决斗伤害后，可以按奇珍规则抢装备吗？
answer: |-
  不能。奇珍夺取要求：装备区里有奇珍牌的角色受到由杀造成的伤害；该次伤害结算后，伤害来源可以获得受伤角色装备区里的一张奇珍牌。
  决斗造成的伤害不满足“杀的伤害”，即使双方在决斗中打出了杀，也不因此取得奇珍。失去体力及其他锦囊、技能的伤害，同样不能仅凭造成伤害套用这一夺取规则。
