id: faq_080
question: 珠联璧合标记只能在出牌阶段当桃救自己吗？
answer: |-
  不只限于出牌阶段救自己。手册以分号分开两个用途：一是在自己的出牌阶段弃置珠联璧合标记，摸两张牌；二是将该标记当桃使用。
  在非鏖战的通常条件下，桃的合法机会包括：自己的出牌阶段，在自己受伤时回复自己一点；某角色濒死、轮到自己作救援响应时，为该角色回复一点。因此，标记的桃用途可以依法救自己或他人，不继承前一项“摸两张”的出牌阶段限制。选择一种用途消耗标记后，不能再执行另一种。
  鏖战时桃只能当酒，不能仍以普通桃的救人用途救其他角色；也不能因为使用的是标记，就宣称免受桃的用途限制。
