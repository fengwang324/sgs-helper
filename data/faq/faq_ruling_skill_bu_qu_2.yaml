id: faq_ruling_skill_bu_qu_2
question: |-
  为了简化结算流程，周泰一次扣减多点体力只能发动一次【不屈】，具体操作为：
  体力为Y的周泰受到X点伤害（X≥Y），在扣减X点体力后体力为Y-X：
  周泰发动【不屈】
answer: |-
  为了简化结算流程，周泰一次扣减多点体力只能发动一次【不屈】，具体操作为：
  体力为Y的周泰受到X点伤害（X≥Y），在扣减X点体力后体力为Y-X：
  周泰发动【不屈】，亮出X-Y+1张牌置于武将牌上：
  周泰武将牌上没有点数相同的“创”则存活，体力为1-Z（Z为“创”数），其体力值为0。
  周泰武将牌上出现点数相同的“创”则进入濒死状态，体力为1-Z（Z为“创”数），进行濒死结算，在濒死结算过程中最多可以对周泰使用Z张【桃】/【酒】。出现以下情况濒死结算完毕：
  最后一个进行响应的角色响应完毕后周泰的武将牌上有点数相同的“创”，周泰死亡。
  最后一个进行响应的角色响应完毕后周泰的武将牌上没有点数相同的“创”，周泰存活，体力为1-Z（Z为“创”数），其体力值为0。
  周泰将最后一张“创”置入弃牌堆后，周泰存活，其体力值为1。
  周泰不发动【不屈】，则进入濒死状态，正常进行濒死结算，在濒死结算过程中最多可以对周泰使用X-Y+1张【桃】/【酒】。
  有Y张“创”（即体力为1-Y）的周泰受到X点伤害，在扣减X点体力后体力为1-Y-X：
  周泰发动【不屈】，亮出X张牌置于武将牌上：
  同1-1-1。
  同1-1-2。
  周泰不发动【不屈】，则进入濒死状态，正常进行濒死结算，在濒死结算过程中，对周泰使用的前X张【桃】/【酒】的效果是令周泰回复体力，之后每对其使用一张【桃】/【酒】的效果是周泰将任意一张“创”置入弃牌堆，总计最多可以对周泰使用X+Y张【桃】/【酒】。
