question: 执行【流离】的效果会取消自己且令【流离】的目标角色成为此【杀】的新目标或第N次成为此【杀】的目标，处理完其成为此【杀】的新目标时或第N次成为此【杀】的目标时的所
answer: 你执行【流离】的效果会取消自己且令【流离】的目标角色成为此【杀】的新目标或第N次成为此【杀】的目标，处理完其成为此【杀】的新目标时或第N次成为此【杀】的目标时的所有事件后，【流离】结算完毕。（N＞1）
