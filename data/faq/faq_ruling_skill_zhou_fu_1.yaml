question: 【咒缚】“其将之作为判定牌”即将“判定”中“亮出牌堆顶的一张牌作为判定牌”这个操作改为其将武将牌旁的“咒”置入处理区来作为判定牌
answer: “其将之作为判定牌”即将“判定”中“亮出牌堆顶的一张牌作为判定牌”这个操作改为其将武将牌旁的“咒”置入处理区来作为判定牌。
