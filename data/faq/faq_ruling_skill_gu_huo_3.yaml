id: faq_ruling_skill_gu_huo_3
question: 【蛊惑】声明使用/打出【杀】时须同时声明此【杀】的属性，即你可以声明使用/打出下列三种【杀】里的一种：普通【杀】，火【杀】和雷【杀】
answer: 你发动【蛊惑】声明使用/打出【杀】时须同时声明此【杀】的属性，即你可以声明使用/打出下列三种【杀】里的一种：普通【杀】，火【杀】和雷【杀】。
