id: faq_075
question: 杀死同势力角色，是只弃手牌吗？
answer: |-
  不只弃手牌。已确定势力的角色杀死同势力角色，须弃置自己的所有手牌和装备区里的牌。
  判定区里的牌不在这项击杀惩罚的弃置范围内。例如，你有三张手牌、两张装备和判定区一张乐不思蜀，应弃掉三张手牌及两张装备，乐不思蜀仍留在判定区。
  击杀者全暗、未确定势力时不执行这项奖惩；野心家与其他角色视为不同势力，不因原武将牌面相同套用同势力击杀惩罚。
variant: 群狼环鼎
