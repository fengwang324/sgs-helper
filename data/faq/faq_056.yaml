id: faq_056
question: 失去体力能触发受到伤害后的技能吗？
answer: |-
  不会。失去体力不属于受到伤害，没有伤害来源，不触发“受到伤害后”“造成伤害后”等仅以伤害为条件的技能，也不触发属性伤害的连环传导。
  例如，失去一点体力不能发动遗计、反馈这类受到伤害后技能。若因此实际体力降至零或以下，仍要进入濒死救援；濒死由体力结果引发，不表示此前的失去体力变成了伤害。
variant: 群狼环鼎
