id: faq_rule_flow_statechange
question: 牌状态改变能发动的技能？
answer: |-
  a.翻面后：【解围】、【法恩】。
  b.横置后：【法恩】。
  c.武将牌明置后：【闺秀①】。
  d.武将牌移除后：【闺秀②】。
  e.游戏牌亮出后：【鹰扬】。
