id: faq_043
question: 火杀连环传导造成伤害，能触发奇珍夺取吗？
answer: |-
  按所引九变篇讲解及通用连环渠道解释，可以，但传导到的角色须实际受到这张属性杀渠道的伤害，并且伤害后装备区仍有奇珍牌。
  属性杀触发连环后，传导伤害保留原伤害的来源、渠道和属性。因此，原伤害来源对每名实际受到这类传导伤害的角色，分别取得一次可获得其装备区一张奇珍牌的机会。
  例如，甲的火杀伤到横置的乙，传导后丙也受伤且仍装备奇珍，甲可分别从乙、丙各获得一张；不是从乙一次拿两张。某名角色的伤害被完全防止时，对该角色没有这次夺取机会。
  手册没有单列传导例子，这一适用范围依据玩家讲解和通用伤害渠道规则。
variant: 群狼环鼎
