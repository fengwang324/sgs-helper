id: faq_041
question: 奇珍进单独弃牌小堆，会退出游戏吗？
answer: |-
  不是。奇珍牌弃置后可以单独放在一个小堆中便于检索，但这个小堆仍属于弃牌堆，不属于移出游戏区。
  从弃牌堆检索奇珍牌的效果仍可找到这些牌；需要将弃牌堆洗成新摸牌堆时，也须把这部分奇珍牌与其他弃牌一同洗入。
  “单独放置”只是桌面整理方式，不会改变牌的所在区域，不能因此让奇珍永远不进入摸牌堆。
