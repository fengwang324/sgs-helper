id: faq_016
question: 合纵交给全暗角色能摸等量牌吗？
answer: |-
  可以交给尚未确定势力的其他角色，但不因此摸牌。
  “合纵”的基础处理是：出牌阶段限一次，交给一名其他、与你势力不同或未确定势力的角色至多三张有合纵标记的牌。若接受者已经确定势力且与你势力不同，你摸与交出数量相同的牌；若接受者仍全暗、未确定势力，只交牌，不摸牌。
  例如，交出两张合纵牌给全暗角色，自己不摸牌；交给已确定为另一势力的角色，自己摸两张。不能预判全暗角色之后会亮成敌方而提前摸牌。
variant: 群狼环鼎
