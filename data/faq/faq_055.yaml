id: faq_055
question: 受到致命伤害后，受伤后的技能能先发动自救吗？
answer: |-
  不会。伤害扣减体力使角色濒死时，先插入濒死救援流程，完成救援或死亡处理后，才继续原伤害流程中“受到伤害后”等后续时机。
  例如，一点体力的郭嘉受到一点伤害，不能先结算遗计摸牌，再从新摸的牌中找桃救自己；应先处理濒死。救活后，才到后续伤害时机判断是否能发动遗计。
  若角色已死亡，不能因为之前本来有伤害后技能，就越过死亡状态继续当作存活角色发动该技能。
variant: 群狼环鼎
