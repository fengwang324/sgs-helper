id: faq_027
question: 被换下来的副将以后还能抽回来吗？
answer: |-
  按当前版本讲解，原副将移出游戏，不回到武将牌堆，不会在之后变更副将时再次被翻到。
  变更时亮出的其他、未被选中的武将牌洗混置于武将牌堆底；它们与原副将的去向不同。
  手册第13页前段有把原副将与其他亮出武将一同置底的表述，后段又明确原副将移出游戏。这里采用其后段及当前版本讲解一致的处理；不是两种去向同时执行。
variant: 群狼环鼎
