id: faq_ruling_skill_ju_xiang_1
question: 【巨象】触发【巨象②】的条件是：其他角色是使用非转化的【南蛮入侵】，或将一张【南蛮入侵】当【南蛮入侵】使用
answer: |-
  触发【巨象②】的条件是：其他角色是使用非转化的【南蛮入侵】，或将一张【南蛮入侵】当【南蛮入侵】使用。
  例如：全场只有两名角色，其中一名角色对另一名角色祝融使用【南蛮入侵】，对唯一的目标祝融无效，此【南蛮入侵】置入弃牌堆后，祝融会触发【巨象②】。
  例如：曹操发动【奸雄】获得【南蛮入侵】后，该【南蛮入侵】最后轮到对小乔进行结算，小乔在受到1点伤害时发动【天香】将此伤害转移给曹操，曹操受到1点伤害死亡，弃置其所有牌（包括该【南蛮入侵】）及判定区里的牌，然后该【南蛮入侵】结算完毕。该【南蛮入侵】是因为曹操死亡时弃置其手牌才置入弃牌堆而非因为使用结算完毕后置入弃牌堆，因此祝融不会触发【巨象②】。
  例如：除非荀攸发动【奇策】将唯一的一张手牌【南蛮入侵】当【南蛮入侵】使用，否则其发动【奇策】使用的【南蛮入侵】因结算完毕而置入弃牌堆后，祝融不会触发【巨象②】。
  例如：于吉用非【南蛮入侵】的牌发动【蛊惑】使用【南蛮入侵】，没有角色质疑，在因结算完毕而置入弃牌堆后祝融不会触发【巨象②】；于吉用【南蛮入侵】发动【蛊惑】使用【南蛮入侵】，没有角色质疑，在因结算完毕而置入弃牌堆后祝融会触发【巨象②】。
