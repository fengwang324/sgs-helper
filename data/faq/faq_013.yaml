id: faq_013
question: 野心家武将能作副将吗？
answer: |-
  不能。牌面势力为野心家的武将只能作主将，不能作副将，也不能将两张野心家武将组成主、副将。
  野心家主将可以搭配任意势力的非野心家副将。仅明置副将时暂按副将势力处理；明置野心家主将后转为野心家势力，并获得其“野心家”标记。
variant: 群狼环鼎
