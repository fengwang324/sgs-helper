id: faq_083
question: 诏书只能自己贡献手牌吗？
answer: |-
  不是。诏书放在持有者武将牌上后，与持有者同势力的角色可以在各自出牌阶段限一次贡献手牌：通常一张；贡献者为小势力角色时，改为至多两张。判断的是贡献者的同势力和大／小势力状态，不是持有者任意向别人收牌。
  持有者在自己的出牌阶段限一次，若诏书上已有四种不同花色的牌，可以弃置诏书上所有牌，随机获得一张势力锦囊。弃的是上面的全部贡献牌，不是只弃四张，也不是弃掉诏书本身。
  例如，诏书上有五张牌且四种花色齐全，发动时五张全部弃置；若只有三种花色，即使累计很多张也不能发动换取锦囊。
