id: faq_ruling_skill_huo_shou_1
question: 【祸首】【祸首②】的效果的本质即你将此【南蛮入侵】的效果改为：每名目标角色需打出【杀】，否则受到发动此次【祸首②】的角色造成的1点伤害
answer: |-
  【祸首②】的效果的本质即你将此【南蛮入侵】的效果改为：每名目标角色需打出【杀】，否则受到发动此次【祸首②】的角色造成的1点伤害。
  例如：孟获在张春华使用【南蛮入侵】指定目标后会触发【祸首②】，轮到对曹操进行结算时，曹操没有打出【杀】进行响应，则受到孟获造成的1点伤害，在受到1点伤害后可以发动【奸雄】获得该【南蛮入侵】。
mode: identity
source:
  type: official_rule
  reference: https://gltjk.com/sanguosha/rules/
