printed_text: |-
  每名吴势力角色的出牌阶段限一次，该角色可以将一张装备牌置于你的“缘江烽火图”上，称为“烽火”。
  每名吴势力的准备阶段，该角色可以根据“烽火”数量的规则在“①英姿”、“②好施”、“③逐猎”、“④度势”中选择技能，然后获得所选技能直到回合结束。
  “烽火”数为：1，选择技能①；2，在技能①②中选择一个；3，在技能①②③中选择一个；4，在技能①②③④中选择一个；5或以上，在技能①②③④中选择两个。
  锁定技，当你受到【杀】或锦囊牌造成的伤害后，你移去一张“烽火”。
