id: timing_mo_pai_jie_duan_kai_shi_shi
name: 摸牌阶段开始时
description: |-
  角色进入摸牌阶段但还没有摸牌。
  能发动的技能/能执行的技能效果：【突袭（标）】、【遗计】获得“计”的效果、【恂恂】、【再起】、【眩惑】、【父魂（旧将）】、【横征】、【双雄】、【悟心】、【涉猎】。
