id: timing_you_xi_kai_shi_qian_fen_fa_qi_shi_shou_pai_shi
name: 游戏开始前分发起始手牌时
description: |-
  能发动/产生影响的技能：【挫锐①】、【七星①】。
  注意：因获得牌发动的技能不考虑分发起始手牌导致的获得牌。
  例如：夏侯惇在获得起始手牌后不能发动【清俭】。
