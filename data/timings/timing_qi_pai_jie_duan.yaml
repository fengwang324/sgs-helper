id: timing_qi_pai_jie_duan
name: 弃牌阶段
description: |-
  若角色的手牌数大于其手牌上限，该角色须弃置X张手牌（X为其手牌数与手牌上限之差）。
  会影响手牌上限的技能/技能效果：【太平要术②】、【横江】、【权计②】、【英姿②】、【慎拒】、【不屈②】、【血裔】、【妄尊】、【宗室】、【绝境②】、【神威②】。
  能对弃置手牌产生影响的技能有：【鸡肋】。
mode: common
source:
  type: official_rule
  reference: https://gltjk.com/sanguosha/rules/
verification_status: unverified
