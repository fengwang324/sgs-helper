id: keyword_jiao_huan
name: 交换
definition: |-
  交换的双方先同时将自己的所有手牌/装备区里的牌移动到处理区，然后同时将原本为对方所拥有的牌从处理区移动到自己的手牌/装备区里。
  ◆交换手牌/身份牌时须背面朝上交换。
  ◆交换的其中一方可以没有指定交换的牌，也可以双方都没有指定交换的牌（此情况依然视为执行了交换的效果）。
  例如：吴国太可以对两名装备区里都没有牌的角色发动【甘露】。
mode: common
source:
  type: official_rule
  reference: https://gltjk.com/sanguosha/rules/
verification_status: unverified
