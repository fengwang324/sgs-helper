id: keyword_117
name: 野心家标记的规则用途
definition: |-
  野心家主将明置时获得的标记，区别于表示普通野心家身份的身份牌。
  可以按以下任一种标记用途消耗：珠联璧合——自己的出牌阶段摸两张，或当桃依法使用；阴阳鱼——自己的出牌阶段摸一张，或弃牌阶段使本回合手牌上限加二；先驱——自己的出牌阶段将手牌摸至四张，并观看一名其他角色的一张武将牌。
  也可以保留到暴露野心：此时仍有标记且存活人数至少三名，可以发起拉拢人心；其他角色依次选择是否加入，野心家与君主不可加入，至多一名加入。加入者放置相应标记，与发起者共享胜利条件，并可将手牌摸至四张、回复一点体力。
  将标记按珠联璧合、阴阳鱼或先驱的用途消耗后，不能再用同一标记执行另一种用途；若之后暴露野心时已没有野心家标记，就不满足发起拉拢人心的标记条件。
variant: 群狼环鼎
