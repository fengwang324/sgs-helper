id: keyword_liang_chu
name: 亮出
definition: |-
  将背面朝上的牌翻转至正面朝上。
  ◆从牌堆顶亮出的牌须置入处理区。
  例如：角色进行一次判定时，亮出牌堆顶的一张牌，此牌须置入处理区，在置入处理区后，即此判定牌生效前。
