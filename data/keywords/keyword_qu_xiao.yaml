id: keyword_qu_xiao
name: 取消
definition: 在一张牌的使用流程中取消一名目标角色，即令其不再是此牌的目标。若将其取消后，此牌仍有其他目标，则继续对其他目标进行结算；若此牌仅有的目标被取消，则终止此牌的使用流程。
mode: common
