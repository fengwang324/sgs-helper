id: keyword_mou_shi_wu_zui_duo_shao
name: （某事物）最多/少
definition: |-
  允许有多名角色的该事物并列最多/少，即这些角色中的每一名都是该事物最多/少的。
  ◆若所有角色都没有该事物，则不存在该事物最多的角色。
mode: common
