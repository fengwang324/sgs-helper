id: keyword_zhuang_bei_qu
name: 装备区
definition: 角色使用的装备牌放置的区域。此区域里共有五个位置，分别放置武器牌、防具牌、【+1坐骑】、【-1坐骑】和宝物牌。装备区里的牌须正面朝上放置。
