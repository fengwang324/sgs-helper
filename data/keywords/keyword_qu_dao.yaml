id: keyword_qu_dao
name: 渠道
definition: |-
  因执行技能或牌的效果而造成伤害，此伤害可以称为此牌/技能造成的伤害，此牌/技能可以称为造成此伤害的牌/技能，亦即此牌/技能为此伤害的渠道。
  确定渠道的方法：
  因执行牌或技能的效果而造成伤害，其渠道为此牌或此技能。
  因连环传导而造成伤害，其渠道与触发连环的伤害相同。
  因转移伤害而造成伤害，其渠道与被转移的伤害相同。
mode: common
source:
  type: official_rule
  reference: https://gltjk.com/sanguosha/rules/
