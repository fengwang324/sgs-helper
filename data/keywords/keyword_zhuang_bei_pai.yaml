id: keyword_zhuang_bei_pai
name: 装备牌
definition: |-
  装备牌分为武器牌、防具牌、坐骑牌和宝物牌：带有“装备/武器”标识的为武器牌，带有“装备/防具”标识的为防具牌，带有“装备/坐骑”标识的为坐骑牌（能改变角色之间的距离），带有“装备/宝物”标识的为宝物牌。一名角色的装备区里只能放置一张武器/防具/【-1坐骑】/【+1坐骑】牌（尽管【-1坐骑】和【+1坐骑】各有数张名称不同的牌）/宝物牌，若其想变更即有武器/防具/坐骑/宝物的该角色使用武器牌/防具牌/坐骑牌/宝物牌，其将使用的武器牌/防具牌/坐骑牌/宝物牌置于其装备区里的相应位置同时将该位置的原武器牌/防具牌/坐骑牌/宝物牌置入处理区，然后将处理区里的原武器牌/防具牌/坐骑牌/宝物牌置入弃牌堆。
  ◆当角色将武器牌/坐骑牌当其他牌使用，或弃置武器牌/坐骑牌作为发动技能的消耗时，不能同时用到该武器牌/坐骑牌提供的距离、攻击范围或技能。
  例如：邓艾发动【急袭】计算与其他角色的距离时，不计入当【顺手牵羊】使用的“田”（与装备牌同理）。
  例如：对装备【麒麟弓】的关羽使用【借刀杀人】：
  选择对距离为1的角色使用【杀】时，关羽可以发动【武圣】将其装备区里的【麒麟弓】当【杀】对该角色使用进行响应（但关羽造成伤害时不可以发动【麒麟弓】，因为此时其装备区里已经没有【麒麟弓】了）。
  选择对距离为2以上的角色使用【杀】时，关羽不可以发动【武圣】将其装备区里的【麒麟弓】当【杀】对该角色使用进行响应。
  注意：装备【-1坐骑】对距离为3的角色使用【杀】被【闪】抵消时，可以通过弃置装备区里的【-1坐骑】和另一张牌的方式发动【贯石斧】，因为此时此【杀】已经通过合法性检测，所以弃置【-1坐骑】不需要考虑目标角色是否在其攻击范围内。
  ◆当角色用到一张装备牌提供的距离、攻击范围或技能时，不能以任何方式操作该装备牌。
  例如：不可以通过弃置装备区里的【贯石斧】和另一张牌的方式发动【贯石斧】。
  例如：装备【诸葛连弩】的关羽在出牌阶段使用过【杀】后，不可以发动【武圣】将其装备区里的【诸葛连弩】当【杀】使用。
  例如：体力为2的赵云（神）不可以发动【龙魂】将装备区里的【木牛流马】和一张方片“粮”当火【杀】使用或打出。
  ◆装备技能的效果与武将技能的同类效果能叠加。
  例如：其他角色与装备【+1坐骑】的曹操（神）的距离+2。
  例如：太史慈使用【杀】在选择目标时受到【天义】和【方天画戟】的影响，至多可以选择四个目标。
  ◆角色使用装备牌的目标默认为该角色。
