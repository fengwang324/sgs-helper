id: keyword_071
name: 变更副将
definition: |-
  按指定效果替换副将。已确定普通势力的角色从剩余武将牌堆顶逐张亮出，取第一张符合势力条件的武将作为新副将；开始翻牌后，遇到首张合格武将就必须选取，不能取消或跳过继续挑选。
  按手册后段及当前版本讲解，原副将移出游戏；其他亮出但未选中的武将洗混置于武将牌堆底。体力上限不变，不重新触发珠联璧合或单独阴阳鱼的奖励。
  对未确定势力角色和牌面为野的主将，玩家 FAQ 补充为取第一张非野心家武将；这两类筛选办法未由手册明确，不能当作手册原文。
  上述玩家筛选办法也不能仅凭角色叫“野心家”，就自动推广给普通武将因人数等规则取得野心家身份的全部情况。
variant: 群狼环鼎
