id: keyword_shou_pai_shang_xian
name: 手牌上限
definition: |-
  角色的手牌上限为其体力值。手牌上限通常只于角色的弃牌阶段提及，角色能保留的手牌数不能超过其手牌上限。
  ◆手牌上限经过修正后最小值为0。
  例如：臧霸受到2点伤害后，对体力值为1的来源连续发动两次【横江】，此时来源的手牌上限-2，为0。
mode: common
source:
  type: official_rule
  reference: https://gltjk.com/sanguosha/rules/
verification_status: unverified
