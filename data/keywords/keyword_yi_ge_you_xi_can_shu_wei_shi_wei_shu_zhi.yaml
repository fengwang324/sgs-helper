id: keyword_yi_ge_you_xi_can_shu_wei_shi_wei_shu_zhi
name: （一个游戏参数）为/视为（数值）
definition: |-
  为此参数赋值。“为”表示此数值可以被修正，“视为”表示此参数无论经过怎样的修正最终都是被赋值为此数值。
  例如：袁术发动【妄尊】令有“创”的周泰的手牌上限-1，此回合内周泰的手牌上限为“创”数-1。
  例如：A与B的距离视为1即无论A与B的距离本来是多少（或有经过坐骑牌的修正），最终都视为是1。
mode: common
source:
  type: official_rule
  reference: https://gltjk.com/sanguosha/rules/
verification_status: unverified
