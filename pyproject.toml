[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sgs-helper"
version = "0.1.0"
description = "三国杀线下助手资料库：YAML 为唯一权威源，SQLite 为可随时重建的生成物"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "fengwang324", email = "fengwang324@gmail.com" }]
dependencies = [
    "PyYAML>=6.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
#: 本地资料管理网页（只在本地跑，不参与线上部署）
admin = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
sgs-validate = "sgs_helper.cli:validate_main"
sgs-build = "sgs_helper.cli:build_main"
sgs-query = "sgs_helper.cli:query_main"
sgs-admin = "sgs_helper.cli:admin_main"

[tool.setuptools]
packages = ["sgs_helper", "sgs_helper.admin"]

[tool.setuptools.package-data]
"sgs_helper.admin" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
